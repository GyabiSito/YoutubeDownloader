services:
  pot-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:1.3.1-deno
    restart: unless-stopped

  app:
    build: .
    depends_on:
      - pot-provider
    ports:
      - "8000:80"
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      LOG_CHANNEL: stderr
      SESSION_DRIVER: cookie
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      YT_DLP_BINARY: yt-dlp
      FFMPEG_BINARY: ffmpeg
      DENO_BINARY: deno
      YOUTUBE_POT_PROVIDER_URL: http://pot-provider:4416
    restart: unless-stopped
